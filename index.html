<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ücretsiz online araçlar - Karakter sayacı, şifre oluşturucu, QR kod, birim dönüştürücü ve daha fazlası.">
    <meta name="keywords" content="online araçlar, karakter sayacı, şifre oluşturucu, QR kod, birim dönüştürücü, ücretsiz araçlar">
    <title>AraçKutusu - Ücretsiz Online Araçlar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="/" class="logo">Araç<span>Kutusu</span></a>
                <div class="nav-actions">
                    <button id="themeToggle" class="theme-btn" aria-label="Tema değiştir">&#9790;</button>
                    <button id="menuToggle" class="menu-btn" aria-label="Menü">&#9776;</button>
                </div>
            </nav>
            <div class="hero">
                <h1>Online Araçlar</h1>
                <p>Günlük işlerini hızlıca hallet. Her araç ücretsiz, reklamsız ve hızlı.</p>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="ad-placeholder" id="adTop">
            <div class="ad-label">Reklam</div>
            <div class="ad-content">AdSense buraya eklenecek</div>
        </div>

        <div class="tools-grid" id="toolsGrid"></div>

        <div class="tool-detail" id="toolDetail" style="display:none">
            <button class="back-btn" id="backBtn">&larr; Geri</button>
            <div id="toolContent"></div>
        </div>

        <div class="ad-placeholder" id="adBottom">
            <div class="ad-label">Reklam</div>
            <div class="ad-content">AdSense buraya eklenecek</div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 AraçKutusu. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
